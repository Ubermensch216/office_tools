<body>

    <div class="container mt-5">

            <!-- Left Column: Controls -->

                <div class="card">

                        <h5 class="card-title"><i class="bi bi-gear me-2"></i>2. 작업 실행</h5>

            <!-- Right Column: Information -->
            <div class="col-lg-7">
                <div class="card mb-4">
                    <div class="card-body">

                        <div id="file-list-area" class="mt-3">

                    <div class="card-body">

                        <div id="preview-area" class="mt-3">

                        </div>
                        <div class="d-grid">
                            <a id="download-link" class="btn btn-success mt-3 d-none" href="#"><i class="bi bi-download me-2"></i>결과 파일 다운로드</a>

            </div>

    <!-- Main Application Logic -->
    <script>
        const fileInput = document.getElementById('file-input');
        const fileListArea = document.getElementById('file-list-area');
        const mergeBtn = document.getElementById('merge-btn');
        const splitBtn = document.getElementById('split-btn');
        const previewArea = document.getElementById('preview-area');
        const downloadLink = document.getElementById('download-link');
        const outputFilenameInput = document.getElementById('output-filename');
        const fileDropZone = document.getElementById('file-drop-zone');

        let selectedFiles = [];

        async function handleFiles(files) {
            selectedFiles = Array.from(files);
            await renderFileList();
        }

        // 1. 파일 선택 이벤트 핸들러
        fileInput.addEventListener('change', (event) => {
            handleFiles(event.target.files);
        });

        // Drag and drop event listeners
        fileDropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            fileDropZone.classList.add('border-primary');
        });

        fileDropZone.addEventListener('dragleave', (event) => {
            event.preventDefault();
            fileDropZone.classList.remove('border-primary');
        });

        fileDropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            fileDropZone.classList.remove('border-primary');
            handleFiles(event.dataTransfer.files);
        });

        // 2. 선택된 파일 목록을 화면에 렌더링하는 함수
        async function renderFileList() {
            fileListArea.innerHTML = ''; // 기존 목록 초기화
            if (selectedFiles.length === 0) {
                fileListArea.innerHTML = '<p class="text-muted">파일을 선택하면 여기에 정보가 표시됩니다.</p>';
                return;
            }

            const listGroup = document.createElement('div');
            listGroup.className = 'list-group';

            for (const file of selectedFiles) {
                const fileTypeInfo = getFileType(file.name);
                let fileInfo = '분석 중...';

                const item = document.createElement('div');
                item.className = 'list-group-item';

                item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1"><i class="bi ${fileTypeInfo.icon} file-icon"></i>${file.name}</h6>
                        <small class="file-info-cell">${fileInfo}</small>
                    </div>
                    <input type="text" class="form-control form-control-sm mt-2 range-input" placeholder="처리 범위 (예: 1, 3-5)">
                `;
                listGroup.appendChild(item);

                // 비동기 파일 정보 분석 및 업데이트
                analyzeFile(file, item.querySelector('.file-info-cell'));
            }
            fileListArea.appendChild(listGroup);
        }

        async function analyzeFile(file, infoCell) {
            const fileType = getFileType(file.name).type;
            let fileInfoText = 'N/A';
            try {
                switch (fileType) {
                    case 'PDF':
                        const pdfDoc = await pdfLib.PDFDocument.load(await file.arrayBuffer());
                        fileInfoText = `${pdfDoc.getPageCount()} 페이지`;
                        break;
                    case 'XLSX':
                        const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array' });
                        fileInfoText = `${workbook.SheetNames.length}개 시트`;
                        break;
                    case 'DOCX':
                        const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
                        const pageCount = Math.ceil(result.value.length / 1500); // Rough estimation
                        fileInfoText = `약 ${pageCount} 페이지`;
                        break;
                    case 'TXT':
                        const text = await file.text();
                        const lineCount = text.split('\n').length;
                        fileInfoText = `${lineCount} 라인`;
                        break;
                }
            } catch (e) {
                console.error('Error analyzing file:', file.name, e);
                fileInfoText = '<span class="text-danger">분석 오류</span>';
            }
            infoCell.innerHTML = fileInfoText;

        // 병합 버튼 이벤트 핸들러
        mergeBtn.addEventListener('click', async () => {
            if (selectedFiles.length < 2) {
                alert('병합하려면 2개 이상의 파일을 선택해야 합니다.');
                return;
            }

            previewArea.innerHTML = '<p>병합 작업 중...</p>';
            downloadLink.classList.add('d-none');

            try {
                const firstFileType = getFileType(selectedFiles[0].name);
                // 모든 파일이 동일한 타입인지 확인
                if (!selectedFiles.every(f => getFileType(f.name) === firstFileType)) {
                    alert('동일한 종류의 파일만 병합할 수 있습니다.');
                    previewArea.innerHTML = '<p class="text-danger">오류: 동일한 파일 타입만 병합 가능합니다.</p>';
                    return;
                }

                let mergedBlob;
                let mergedFileName = outputFilenameInput.value || 'merged_file';

                switch (firstFileType) {
                    case 'PDF':
                        mergedBlob = await mergePdfs();
                        mergedFileName += '.pdf';
                        break;
                    case 'XLSX':
                        mergedBlob = await mergeXlsx();
                        mergedFileName += '.xlsx';
                        break;
                    case 'DOCX':
                        mergedBlob = await mergeDocx();
                        mergedFileName += '.docx';
                        break;
                    case 'TXT':
                        mergedBlob = await mergeTxt();
                        mergedFileName += '.txt';
                        break;
                    default:
                        alert('지원하지 않는 파일 형식입니다.');
                        return;
                }

                previewArea.innerHTML = `<p><b>${mergedFileName}</b> 파일이 성공적으로 생성되었습니다. 아래 다운로드 링크를 클릭하세요.</p>`;
                downloadLink.href = URL.createObjectURL(mergedBlob);
                downloadLink.download = mergedFileName;
                downloadLink.classList.remove('d-none');

            } catch (error) {
                console.error('Error during merge:', error);
                previewArea.innerHTML = `<p class="text-danger">병합 중 오류가 발생했습니다: ${error.message}</p>`;
            }
        });

        // PDF 병합 로직
        async function mergePdfs() {
            const mergedPdf = await pdfLib.PDFDocument.create();
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const rangeInput = document.querySelectorAll('.range-input')[i];
                const pagesToCopy = parseRange(rangeInput.value);

                const pdfBytes = await file.arrayBuffer();
                const pdfDoc = await pdfLib.PDFDocument.load(pdfBytes);
                
                const indices = pagesToCopy ? 
                    pagesToCopy.map(p => p - 1).filter(p => p >= 0 && p < pdfDoc.getPageCount()) : 
                    [...Array(pdfDoc.getPageCount()).keys()];

                const copiedPages = await mergedPdf.copyPages(pdfDoc, indices);
                copiedPages.forEach(page => mergedPdf.addPage(page));
            }
            const mergedPdfBytes = await mergedPdf.save();
            return new Blob([mergedPdfBytes], { type: 'application/pdf' });
        }

        // XLSX 병합 로직
        async function mergeXlsx() {
            const newWb = XLSX.utils.book_new();
            for (const file of selectedFiles) {
                const data = await file.arrayBuffer();
                const wb = XLSX.read(data, { type: 'array' });
                wb.SheetNames.forEach(sheetName => {
                    const ws = wb.Sheets[sheetName];
                    // 시트 이름이 중복되지 않도록 파일명을 접두사로 추가
                    const newSheetName = `${file.name.split('.').shift()}_${sheetName}`;
                    XLSX.utils.book_append_sheet(newWb, ws, newSheetName);
                });
            }
            const wbout = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
            return new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        }

        // DOCX 병합 로직 (내용을 합쳐 새 DOCX 생성)
        async function mergeDocx() {
            // 이 예제에서는 텍스트만 추출하여 합칩니다.
            let combinedText = '';
            for (const file of selectedFiles) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                combinedText += result.value + '\n\n---\n\n';
            }
            return new Blob([combinedText], { type: 'text/plain;charset=utf-8' });
        }

        // TXT 병합 로직
        async function mergeTxt() {
            let combinedText = '';
            for (const file of selectedFiles) {
                const text = await file.text();
                combinedText += text + '\n---\n';
            }
            return new Blob([combinedText], { type: 'text/plain;charset=utf-8' });
        }

        """        // 페이지 범위 문자열을 파싱하는 함수 (예: "1, 3-5, 8")
        function parseRange(rangeStr) {
            if (!rangeStr) return null;
            const parts = rangeStr.split(',');
            const pages = [];
            for (const part of parts) {
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                } else {
                    pages.push(Number(part));
                }
            }
            return pages.filter(p => !isNaN(p) && p > 0);
        }

        // 분할 버튼 이벤트 핸들러
        splitBtn.addEventListener('click', async () => {
            if (selectedFiles.length !== 1) {
                alert('분할할 파일 1개만 선택해주세요.');
                return;
            }

            const file = selectedFiles[0];
            const fileType = getFileType(file.name);
            const rangeInput = document.querySelector('.range-input');
            const ranges = parseRange(rangeInput.value);

            previewArea.innerHTML = '<p>분할 작업 중...</p>';
            downloadLink.classList.add('d-none');

            try {
                if (fileType === 'PDF') {
                    await splitPdf(file, ranges);
                } else if (fileType === 'XLSX') {
                    await splitXlsx(file, ranges);
                } else {
                    alert('이 파일 형식은 분할을 지원하지 않습니다.');
                    previewArea.innerHTML = '';
                }
            } catch (error) {
                console.error('Error during split:', error);
                previewArea.innerHTML = `<p class="text-danger">분할 중 오류가 발생했습니다: ${error.message}</p>`;
            }
        });

        // PDF 분할 로직
        async function splitPdf(file, ranges) {
            const pdfBytes = await file.arrayBuffer();
            const pdfDoc = await pdfLib.PDFDocument.load(pdfBytes);
            const totalPages = pdfDoc.getPageCount();

            if (!ranges || ranges.length === 0) {
                // 범위 미지정 시 전체 페이지를 개별 파일로 분할
                ranges = Array.from({length: totalPages}, (_, i) => i + 1);
            }

            let splitCount = 0;
            for (const pageNum of ranges) {
                if (pageNum > 0 && pageNum <= totalPages) {
                    const newPdf = await pdfLib.PDFDocument.create();
                    const [copiedPage] = await newPdf.copyPages(pdfDoc, [pageNum - 1]);
                    newPdf.addPage(copiedPage);
                    
                    const newPdfBytes = await newPdf.save();
                    const blob = new Blob([newPdfBytes], { type: 'application/pdf' });
                    const fileName = `${outputFilenameInput.value || file.name.replace(/.pdf$/i, '')}_page_${pageNum}.pdf`;
                    saveAs(blob, fileName);
                    splitCount++;
                }
            }
            previewArea.innerHTML = `<p>총 ${splitCount}개의 파일로 분할되었습니다.</p>`;
        }

        // XLSX 분할 로직
        async function splitXlsx(file, ranges) {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetNames = workbook.SheetNames;

            if (!ranges || ranges.length === 0) {
                ranges = Array.from({length: sheetNames.length}, (_, i) => i + 1);
            }

            let splitCount = 0;
            for (const sheetIndex of ranges) {
                if (sheetIndex > 0 && sheetIndex <= sheetNames.length) {
                    const sheetName = sheetNames[sheetIndex - 1];
                    const newWb = XLSX.utils.book_new();
                    const ws = workbook.Sheets[sheetName];
                    XLSX.utils.book_append_sheet(newWb, ws, sheetName);
                    
                    const wbout = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const fileName = `${outputFilenameInput.value || file.name.replace(/.xlsx$/i, '')}_sheet_${sheetIndex}.xlsx`;
                    saveAs(blob, fileName);
                    splitCount++;
                }
            }
            previewArea.innerHTML = `<p>총 ${splitCount}개의 시트로 분할되었습니다.</p>`;
        }
""
        function getFileType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            if (extension === 'pdf') return 'PDF';
            if (extension === 'xlsx' || extension === 'xls') return 'XLSX';
            if (extension === 'docx') return 'DOCX';
            if (extension === 'txt') return 'TXT';
            return 'UNKNOWN';
        }
    </script>
